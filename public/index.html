<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Search Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 24px;
      color: #1a1a1a;
      text-align: center;
    }
    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: #4285f4;
    }
    .search-box button {
      padding: 12px 24px;
      font-size: 16px;
      background: #4285f4;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .search-box button:hover { background: #3367d6; }
    .search-box button:disabled { background: #a0c4ff; cursor: not-allowed; }
    .info {
      color: #666;
      font-size: 14px;
      margin-bottom: 12px;
    }
    #results {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .result-item {
      padding: 16px;
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .result-item .title {
      font-size: 18px;
      color: #1a0dab;
      text-decoration: none;
      font-weight: 500;
      display: block;
      margin-bottom: 4px;
    }
    .result-item .title:hover { text-decoration: underline; }
    .result-item .url {
      font-size: 13px;
      color: #006621;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .result-item .snippet {
      font-size: 14px;
      color: #545454;
      line-height: 1.5;
    }
    #status {
      text-align: center;
      color: #666;
      margin-top: 12px;
      font-size: 14px;
    }
    #error {
      color: #d93025;
      text-align: center;
      margin-bottom: 12px;
    }
    .download-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #34a853;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .download-btn:hover { background: #2d8e47; }
    .download-btn:disabled { background: #a0d4aa; cursor: not-allowed; }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Vyhledávač — 1. strana výsledků</h1>
    <p class="info">Zadejte klíčové slovní spojení a získejte přirozené výsledky (Google, fallback: DuckDuckGo).</p>
    <div class="search-box">
      <input
        type="text"
        id="queryInput"
        placeholder="Např. nejlepší restaurace Praha..."
        autofocus
      />
      <button id="searchBtn" onclick="doSearch()">Hledat</button>
    </div>
    <div id="error"></div>
    <div id="status"></div>
    <div id="results"></div>
    <div class="actions" id="actions" style="display:none">
      <button class="download-btn" onclick="downloadJSON()">Stáhnout JSON</button>
      <button class="download-btn" onclick="downloadCSV()" style="background:#ea4335">Stáhnout CSV</button>
    </div>
  </div>

  <script>
    let lastResults = null;

    async function doSearch() {
      const input = document.getElementById('queryInput');
      const btn = document.getElementById('searchBtn');
      const status = document.getElementById('status');
      const error = document.getElementById('error');
      const resultsDiv = document.getElementById('results');
      const actions = document.getElementById('actions');

      const query = input.value.trim();
      if (!query) {
        error.textContent = 'Zadejte prosím klíčové slovní spojení.';
        return;
      }

      error.textContent = '';
      resultsDiv.innerHTML = '';
      actions.style.display = 'none';
      btn.disabled = true;
      status.textContent = 'Vyhledávám...';

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Neznámá chyba');
        }

        lastResults = data;

        status.textContent = `Nalezeno ${data.totalResults} výsledků pro dotaz: "${data.query}"`;

        if (data.totalResults === 0) {
          resultsDiv.innerHTML = '<p style="text-align:center;color:#666">Nebyly nalezeny žádné výsledky.</p>';
        } else {
          const html = data.results.map((r, i) => `
            <div class="result-item">
              <a class="title" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a>
              <div class="url">${escapeHtml(r.url)}</div>
              <div class="snippet">${escapeHtml(r.snippet || '')}</div>
            </div>
          `).join('');
          resultsDiv.innerHTML = html;
          actions.style.display = 'flex';
        }
      } catch (err) {
        error.textContent = 'Chyba: ' + err.message;
        status.textContent = '';
      } finally {
        btn.disabled = false;
      }
    }

    function downloadJSON() {
      if (!lastResults) return;
      const blob = new Blob([JSON.stringify(lastResults, null, 2)], { type: 'application/json' });
      downloadBlob(blob, 'google-results.json');
    }

    function downloadCSV() {
      if (!lastResults || !lastResults.results) return;
      const header = 'Title,URL,Snippet\n';
      const rows = lastResults.results.map(r =>
        `"${(r.title||'').replace(/"/g,'""')}","${(r.url||'').replace(/"/g,'""')}","${(r.snippet||'').replace(/"/g,'""')}"`
      ).join('\n');
      const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8' });
      downloadBlob(blob, 'google-results.csv');
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Enter key trigger
    document.getElementById('queryInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doSearch();
    });
  </script>
</body>
</html>
